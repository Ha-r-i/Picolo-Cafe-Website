project_id = "piccolo-cafe"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
minimum_password_length = 12
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/account", "http://127.0.0.1:3000/account"]
enable_signup = true
[auth.rate_limit]
email_sent = 10
[auth.email]
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "3MiB"
